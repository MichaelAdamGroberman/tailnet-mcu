; tailnet-mcu — library CI envs
[platformio]
default_envs = native

[env:native]              ; host-native unit tests (no hardware)
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I src
test_build_src = yes
; Compile ONLY the portable (Arduino-free) sources into host tests.
; Arduino-only backends/transports are excluded here and covered by the
; board compile matrix instead.
build_src_filter = +<WgConfig.cpp> +<RadioManager.cpp> +<TailnetPeer.cpp> +<transport/token_gate.cpp>

[env:esp32-s3]
; Pinned to the pioarduino platform (arduino-esp32 3.x / IDF5); see app demo
; platformio.ini for why the registry "espressif32" is not used.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
build_flags = -std=gnu++17
lib_deps =
  felipedadison/WireGuard-ESP32 @ ^0.2.0
  h2zero/NimBLE-Arduino @ ^2.5.0

[env:pico-w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
build_flags = -std=gnu++17
; lib_deps for the WireGuard implementation is confirmed in Task 5 (spike).
