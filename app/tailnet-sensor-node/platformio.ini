; tailnet-sensor-node — demo app
; Flash to an ESP32-S3 or Raspberry Pi Pico W sensor node that exposes a
; read/mode-switch API over TCP (WiFi) or BLE (BT).
[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags = -std=gnu++17
lib_deps =
  felipedadison/WireGuard-ESP32 @ ^0.2.0
  h2zero/NimBLE-Arduino @ ^2.2.0
  file://../../

[env:pico-w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
build_flags = -std=gnu++17
lib_deps =
  file://../../
; TODO: add BTstack BLE + WireGuard-RP2040 deps when Pico W backends land
