; tailnet-sensor-node — demo app
; Flash to an ESP32-S3 or Raspberry Pi Pico W sensor node that exposes a
; read/mode-switch API over TCP (WiFi) or BLE (BT).
[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags = -std=gnu++17
lib_deps =
  felipedadison/WireGuard-ESP32 @ ^0.2.0
  h2zero/NimBLE-Arduino @ ^2.2.0
  file://../../

[env:pico-w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
build_flags = -std=gnu++17
lib_deps =
  jaszczurtd/arduino-wireguard-pico-w @ ^0.1.8
  file://../../
; Exclude the ESP32-only WireGuard lib that PIO may pull in transitively when
; resolving the file:// dependency (the root platformio.ini lists it for esp32-s3).
lib_ignore = WireGuard-ESP32, NimBLE-Arduino
; BTstack BLE (iot-gamer/pico-ble-notify) NOT added: BTstack requires a single
; global gattWriteCallback() that conflicts with library-internal RX handling.
; The BLE transport compiles as a stub with clear log output.  See docs/roadmap.
